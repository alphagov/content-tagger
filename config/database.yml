default: &default
  adapter: postgresql
  encoding: unicode
  template: template0
  pool: 5

development:
  <<: *default
  database: content-tagger
  url: <%= ENV["DATABASE_URL"] %>

test:
  <<: *default
  database: content-tagger-test
  url: <%= ENV["TEST_DATABASE_URL"] %>

# In production the `DATABASE_URL` environment variable is automatically used.
